version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: xovenmart-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: xovenmart
      POSTGRES_PASSWORD: xovenmart_dev
      POSTGRES_DB: xovenmart
    ports:
      - "5432:5432"
    volumes:
      - xovenmart_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xovenmart"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name: xovenmart-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - postgres

volumes:
  xovenmart_pg_dev:
