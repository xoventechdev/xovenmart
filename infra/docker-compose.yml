# ============================================================
# XovenMart — production docker-compose (Hetzner CPX21)
# 4 GB RAM / 3 vCPU / 80 GB SSD — Nuremberg, Germany
# ============================================================

services:
  # ---------- Postgres 18 ----------
  # Source dump is pg_dump 18.6 and uses Postgres 17+ GUCs
  # (transaction_timeout). Pin to the same major version to avoid
  # silent restore aborts.
  #
  # Mount at /var/lib/postgresql (NOT /var/lib/postgresql/data). PG18's
  # entrypoint refuses to start if a pre-existing datadir is detected
  # at the data subpath without proper pg_upgrade — see
  # https://github.com/docker-library/postgres/issues/37. Mounting
  # the parent lets PG18 manage major-version-specific subdirectories
  # itself.
  postgres:
    image: postgres:18-alpine
    container_name: xovenmart-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xovenmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xovenmart}
      # Performance tuning for 4 GB box
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xovenmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
    mem_limit: 1g

  # ---------- API (NestJS) ----------
  api:
    build:
      context: ..
      dockerfile: ./infra/Dockerfile.api
    container_name: xovenmart-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      BULKSMSBD_API_KEY: ${BULKSMSBD_API_KEY}
      BULKSMSBD_SENDER_ID: ${BULKSMSBD_SENDER_ID:-XovenMart}
      BKASH_MERCHANT_NUMBER: ${BKASH_MERCHANT_NUMBER}
      NAGAD_MERCHANT_NUMBER: ${NAGAD_MERCHANT_NUMBER}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      # Comma-separated allowlist of Origin headers the API will
      # respond to. Without this, main.ts's CORS middleware falls
      # back to a localhost-only dev allowlist and every browser
      # request from https://xovenmart.com is rejected with a CORS
      # error in the console. Defaults to the production domains
      # so the api boots with a sensible allowlist even if the
      # operator forgets to set it in .env.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://xovenmart.com,https://www.xovenmart.com,https://admin.xovenmart.com}
      # Pin the upload root explicitly. The default walk-up-from-CWD
      # logic in main.ts would land here too, but spelling it out
      # means a future Dockerfile WORKDIR change can't silently
      # move the upload root to an empty ephemeral directory.
      UPLOAD_DIR: /repo/apps/api/uploads
      # Backup integration. The bash cron in the `backup` service POSTs
      # to /admin/system/backups/scan/webhook after each dump; the api
      # uses these envs to authenticate the request, register the dump
      # in the `backups` table, and email it to BACKUP_NOTIFY_EMAILS.
      BACKUP_DIR: ${BACKUP_DIR:-/var/lib/xovenmart/backups}
      BACKUP_WEBHOOK_TOKEN: ${BACKUP_WEBHOOK_TOKEN}
      BACKUP_NOTIFY_EMAILS: ${BACKUP_NOTIFY_EMAILS}
      # Secrets-at-rest key for SMTP provider passwords (and AI provider
      # keys — see apps/api/src/shared/crypto/secrets.service.ts). 32-byte
      # base64. Required for the admin "AI Providers" + "Email providers"
      # modules to encrypt/decrypt credentials.
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-${SMTP_ENCRYPTION_KEY}}
    expose:
      - "3001"
    # Persistent volume for product images. Without this, every
    # container restart (Coolify redeploy, OOM, healthcheck fail)
    # wipes the directory and previously-uploaded images 404.
    # Bind mount targets the exact path the API's express.static
    # mount serves from (see apps/api/src/main.ts).
    volumes:
      - api_uploads:/repo/apps/api/uploads
      # Shared with the backup container so a cron dump is visible
      # to the api's scanDisk() walker. The default BACKUP_DIR
      # points at /var/lib/xovenmart/backups inside both containers.
      - backups:/var/lib/xovenmart/backups
    mem_limit: 1g

  # ---------- Web (Next.js) ----------
  web:
    build:
      context: ..
      dockerfile: ./infra/Dockerfile.web
    container_name: xovenmart-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://xovenmart.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:3001}
      NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "3000"
    mem_limit: 1g

  # ---------- Caddy (reverse proxy + auto-TLS via Cloudflare) ----------
  caddy:
    image: caddy:2-alpine
    container_name: xovenmart-caddy
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./uploads:/uploads:ro  # served as static by Caddy
    mem_limit: 256m

  # ---------- Postgres nightly backup → local disk + email ----------
  #
  # Drops pg_dump + uploads snapshot into a shared `backups` named volume,
  # then POSTs the api webhook so the dump registers in the admin UI
  # and the daily email fires (BACKUP_NOTIFY_EMAILS).
  #
  # No R2/AWS — operator explicitly asked for local-only backup.
  backup:
    image: postgres:18-alpine
    container_name: xovenmart-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xovenmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xovenmart}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # API webhook target. Defaults to the in-compose DNS name + the
      # global API_PREFIX (api/v1) so the URL resolves to
      # /api/v1/admin/system/backups/scan/webhook. Override with
      # BACKUP_API_URL if the api moves to a different host.
      BACKUP_API_URL: ${BACKUP_API_URL:-http://api:3001/api/v1}
      BACKUP_WEBHOOK_TOKEN: ${BACKUP_WEBHOOK_TOKEN}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backup-cron.txt:/etc/crontabs/root:ro
      # Shared with the api so its scanDisk() sees the cron output.
      - backups:/backups
      # Bind-mount the api's uploads volume so it can be tar'd alongside
      # the DB dump (product images, brand assets).
      - api_uploads:/uploads-snapshot:ro
    entrypoint: ["crond", "-f"]
    mem_limit: 256m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  api_uploads:
  backups:
