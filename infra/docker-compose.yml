# ============================================================
# XovenMart — production docker-compose (Hetzner CPX21)
# 4 GB RAM / 3 vCPU / 80 GB SSD — Nuremberg, Germany
# ============================================================

services:
  # ---------- Postgres 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: xovenmart-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xovenmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xovenmart}
      # Performance tuning for 4 GB box
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xovenmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
    mem_limit: 1g

  # ---------- API (NestJS) ----------
  api:
    build:
      context: ..
      dockerfile: ./infra/Dockerfile.api
    container_name: xovenmart-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      BULKSMSBD_API_KEY: ${BULKSMSBD_API_KEY}
      BULKSMSBD_SENDER_ID: ${BULKSMSBD_SENDER_ID:-XovenMart}
      BKASH_MERCHANT_NUMBER: ${BKASH_MERCHANT_NUMBER}
      NAGAD_MERCHANT_NUMBER: ${NAGAD_MERCHANT_NUMBER}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      # Pin the upload root explicitly. The default walk-up-from-CWD
      # logic in main.ts would land here too, but spelling it out
      # means a future Dockerfile WORKDIR change can't silently
      # move the upload root to an empty ephemeral directory.
      UPLOAD_DIR: /repo/apps/api/uploads
    expose:
      - "3001"
    # Persistent volume for product images. Without this, every
    # container restart (Coolify redeploy, OOM, healthcheck fail)
    # wipes the directory and previously-uploaded images 404.
    # Bind mount targets the exact path the API's express.static
    # mount serves from (see apps/api/src/main.ts).
    volumes:
      - api_uploads:/repo/apps/api/uploads
    mem_limit: 1g

  # ---------- Web (Next.js) ----------
  web:
    build:
      context: ..
      dockerfile: ./infra/Dockerfile.web
    container_name: xovenmart-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://xovenmart.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:3001}
      NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "3000"
    mem_limit: 1g

  # ---------- Caddy (reverse proxy + auto-TLS via Cloudflare) ----------
  caddy:
    image: caddy:2-alpine
    container_name: xovenmart-caddy
    restart: always
    depends_on:
      - api
      - web
      - n8n
    ports:
      - "80:80"
      - "443:443"
    # The Caddyfile uses ${N8N_ADMIN_USER} / ${N8N_ADMIN_PASSWORD_HASHED}
    # for the n8n.xovenmart.com basicauth block. Caddy substitutes those
    # from its own environment at startup. Generate the hashed password
    # with: docker run --rm caddy:2-alpine caddy hash-password --plaintext '...'
    # Both vars MUST be set in the VPS .env (no defaults) — if either is
    # missing, `docker compose up` fails fast with "variable not set",
    # which is the desired failure mode (an empty password would silently
    # disable the basicauth block).
    environment:
      N8N_ADMIN_USER: ${N8N_ADMIN_USER}
      N8N_ADMIN_PASSWORD_HASHED: ${N8N_ADMIN_PASSWORD_HASHED}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./uploads:/uploads:ro  # served as static by Caddy
    mem_limit: 256m

  # ---------- n8n (chat automation orchestrator) ----------
  # Isolated to its own DB (xovenmart_n8n) so an n8n RCE cannot reach
  # product/order tables. See infra/postgres-init/02-create-n8n-db.sql.
  # Memory cap is generous (1g) because the queue + execution history is
  # held in-process; pruning is configured via EXECUTIONS_DATA_MAX_AGE.
  n8n:
    image: n8nio/n8n:latest
    container_name: xovenmart-n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DB connection (separate DB from the app — see init script 02)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: xovenmart_n8n
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Public URL — must match the Caddy block (n8n.xovenmart.com)
      N8N_HOST: n8n.xovenmart.com
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.xovenmart.com/
      # Localisation
      GENERIC_TIMEZONE: Asia/Dhaka
      # Caddy handles basicauth — disable n8n's own login screen so we
      # have ONE password system, not two.
      N8N_BASIC_AUTH_ACTIVE: "false"
      # Encrypts stored credentials (e.g., the bot service token, page
      # access token). Rotation: see infra/ENV_N8N.md.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Prune old executions after 7 days to keep DB small.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # One reverse proxy hop in front (Caddy → n8n). n8n needs to know
      # this so it trusts the X-Forwarded-* headers for webhook URLs.
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    mem_limit: 1g

  # ---------- Postgres nightly backup → R2 ----------
  backup:
    image: postgres:16-alpine
    container_name: xovenmart-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xovenmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xovenmart}
      # n8n DB creds (for backup of the secondary DB)
      N8N_DB_USER: n8n_user
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-xovenmart-backups}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backup-cron.txt:/etc/crontabs/root:ro
    entrypoint: ["crond", "-f"]
    mem_limit: 256m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  n8n_data:
  api_uploads:
