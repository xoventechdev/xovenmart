# ============================================================
# XovenMart — production docker-compose (Hetzner CPX21)
# 4 GB RAM / 3 vCPU / 80 GB SSD — Nuremberg, Germany
# ============================================================

services:
  # ---------- Postgres 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: xovenmart-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xovenmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xovenmart}
      # Performance tuning for 4 GB box
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xovenmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1GB"
    mem_limit: 1g

  # ---------- API (NestJS) ----------
  api:
    build:
      context: ..
      dockerfile: ./infra/Dockerfile.api
    container_name: xovenmart-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      BULKSMSBD_API_KEY: ${BULKSMSBD_API_KEY}
      BULKSMSBD_SENDER_ID: ${BULKSMSBD_SENDER_ID:-XovenMart}
      BKASH_MERCHANT_NUMBER: ${BKASH_MERCHANT_NUMBER}
      NAGAD_MERCHANT_NUMBER: ${NAGAD_MERCHANT_NUMBER}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
    expose:
      - "3001"
    mem_limit: 1g

  # ---------- Web (Next.js) ----------
  web:
    build:
      context: ..
      dockerfile: ./infra/Dockerfile.web
    container_name: xovenmart-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://xovenmart.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:3001}
      NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "3000"
    mem_limit: 1g

  # ---------- Caddy (reverse proxy + auto-TLS via Cloudflare) ----------
  caddy:
    image: caddy:2-alpine
    container_name: xovenmart-caddy
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./uploads:/uploads:ro  # served as static by Caddy
    mem_limit: 256m

  # ---------- Postgres nightly backup → R2 ----------
  backup:
    image: postgres:16-alpine
    container_name: xovenmart-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xovenmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xovenmart}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-xovenmart-backups}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backup-cron.txt:/etc/crontabs/root:ro
    entrypoint: ["crond", "-f"]
    mem_limit: 256m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
