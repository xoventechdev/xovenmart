# =============================================================================
# XovenMart — Nginx site config (with SSL)
# =============================================================================
# Use this AFTER running `certbot --nginx -d api.xovenmart.com -d ...` on the
# VPS. Certbot creates /etc/letsencrypt/live/<domain>/ with fullchain.pem +
# privkey.pem — we reference those below.
#
# To switch from HTTP-only to HTTPS:
#   1) certbot --nginx -d api.xovenmart.com -d app.xovenmart.com -d xovenmart.com \
#        -d www.xovenmart.com -d admin.xovenmart.com --redirect --agree-tos \
#        -m you@example.com
#   2) sudo cp infra/vps/nginx.conf /etc/nginx/sites-available/xovenmart
#   3) sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

limit_req_zone $binary_remote_addr zone=xovenmart_limit:10m rate=30r/s;

upstream xovenmart_api {
    server 127.0.0.1:3001;
    keepalive 32;
}
upstream xovenmart_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- HTTP → HTTPS redirect (everything except ACME challenge) ----------------
server {
    listen 80;
    listen [::]:80;
    server_name api.xovenmart.com app.xovenmart.com xovenmart.com www.xovenmart.com admin.xovenmart.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- API ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.xovenmart.com;

    ssl_certificate     /etc/letsencrypt/live/api.xovenmart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xovenmart.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=xovenmart_limit burst=60 nodelay;
        proxy_pass http://xovenmart_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- Web (Next.js) — covers app.xovenmart.com, xovenmart.com, www., admin. ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.xovenmart.com xovenmart.com www.xovenmart.com admin.xovenmart.com;

    ssl_certificate     /etc/letsencrypt/live/app.xovenmart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.xovenmart.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Long cache for Next.js static assets (hashed filenames)
    location /_next/static/ {
        proxy_pass http://xovenmart_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /static/ {
        proxy_pass http://xovenmart_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        limit_req zone=xovenmart_limit burst=60 nodelay;
        proxy_pass http://xovenmart_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}