# =============================================================================
# XovenMart — Nginx site config (HTTP-only, pre-SSL)
# =============================================================================
# Installed by bootstrap.sh before DNS + SSL are configured. After running
# `certbot --nginx -d ...` on the VPS, replace this file with the SSL version
# (`infra/vps/nginx.conf`) — certbot will have already generated its own
# HTTP→HTTPS redirect and cert references in /etc/nginx/sites-enabled/.
# =============================================================================

# Rate limit zone (shared across all vhosts). 30 r/s per IP — generous for a
# grocery delivery site, blocks dumb scrapers.
limit_req_zone $binary_remote_addr zone=xovenmart_limit:10m rate=30r/s;

# Upstream definitions — both apps bind to loopback only (UFW blocks public
# access to ports 3000 and 3001, so this is defense-in-depth).
upstream xovenmart_api {
    server 127.0.0.1:3001;
    keepalive 32;
}
upstream xovenmart_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Catch-all HTTP — we'll redirect most domains to HTTPS once SSL is wired,
# but for now this serves the apps directly over HTTP so certbot can validate.
server {
    listen 80;
    listen [::]:80;
    server_name api.xovenmart.com app.xovenmart.com xovenmart.com www.xovenmart.com admin.xovenmart.com;

    # Certbot HTTP-01 challenge MUST be served at /.well-known/acme-challenge/
    # without redirects, or certificate issuance will fail.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # API → NestJS on :3001
    location /api/ {
        limit_req zone=xovenmart_limit burst=60 nodelay;
        proxy_pass http://xovenmart_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Everything else → Next.js on :3000
    location / {
        limit_req zone=xovenmart_limit burst=60 nodelay;
        proxy_pass http://xovenmart_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}