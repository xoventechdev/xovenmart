# =============================================================================
# XovenMart — Postgres config tuned for Contabo VPS 4 (4 GB RAM)
# =============================================================================
# Drop-in at /etc/postgresql/16/main/conf.d/xovenmart.conf on the VPS, then
# `sudo systemctl restart postgresql`. Settings are conservative for 4 GB RAM
# — total memory budget: shared_buffers + work_mem*max_connections + WAL +
# headroom for Node apps (PM2) + Nginx + system ≈ 3.0 GB.
# =============================================================================

# --- Memory -------------------------------------------------------------------
# 25% of 4 GB = 1 GB → reasonable starting point for shared_buffers.
shared_buffers = 1GB

# work_mem: per-operation sort/hash budget. With ~50 concurrent connections,
# this can balloon; keep small. Operations spill to disk rather than OOM.
work_mem = 8MB

# maintenance_work_mem: only used by VACUUM, CREATE INDEX, etc. Generous here
# because backups run during low traffic (03:00).
maintenance_work_mem = 256MB

# effective_cache_size: tells the planner how much OS cache to expect. ~75% of
# total RAM is the rule of thumb.
effective_cache_size = 3GB

# --- WAL + Checkpoints --------------------------------------------------------
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB

# --- Connections --------------------------------------------------------------
max_connections = 100
# NestJS default pool is 10 — with PM2 cluster of 2 instances that's 20. Plus
# Next.js ISR prefetch, psql admin sessions, pg_dump during backup = <40 total
# in practice. 100 is a generous ceiling.

# --- Query planner hints ------------------------------------------------------
random_page_cost = 1.1   # SSD storage; lower than default 4 to favor index scans
effective_io_concurrency = 200  # SSD has high concurrency

# --- Logging ------------------------------------------------------------------
# log_min_duration_statement = 1000   # log queries slower than 1s (debug only)
log_line_prefix = '%t [%p] %q%u@%d '  # timestamp, pid, query tags, user@db
log_checkpoints = on
log_connections = off   # noisy; turn on only when debugging
log_disconnections = off
log_lock_waits = on     # helpful for diagnosing deadlocks
log_temp_files = 0      # log every temp file (debug only)

# --- Autovacuum (defaults are too lazy for write-heavy OLTP) -----------------
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05   # vacuum at 5% dead tuples (default 20%)
autovacuum_analyze_scale_factor = 0.025 # analyze at 2.5% changed (default 10%)