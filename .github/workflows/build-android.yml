name: Build Android APK

# =============================================================================
# Builds the Android customer app APK on every release tag (vX.Y.Z).
# Output is attached to the workflow run as an artifact.
#
# Required secrets (only for signed release APK):
#   KEYSTORE_BASE64  - base64-encoded release keystore
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
# =============================================================================

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      buildType:
        description: "debug (sideload) or release (signed)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/android-customer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-customer/**/build.gradle*', 'apps/android-customer/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore (if release)
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/xovenmart-release.keystore
          ls -la app/xovenmart-release.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        if: github.event.inputs.buildType != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: app/xovenmart-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.buildType || 'release' }}.apk
          path: apps/android-customer/app/build/outputs/apk/${{ github.event.inputs.buildType || 'release' }}/app-${{ github.event.inputs.buildType || 'release' }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f app/xovenmart-release.keystore