name: CI

on:
  push:
    branches: [main]
    # Only run when source / config files change. UI-only or doc changes
    # skip CI (and therefore the deploy). Pairs with deploy-api-cpanel.yml
    # which uses workflow_run to re-deploy after this passes.
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig*.json"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS - Node 20 was deprecated by GitHub in Sep 2025.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
