name: Deploy API → cPanel (FTP)

# =============================================================================
# Fully automatic deploy on every push to main.
#
# Triggers on pushes that touch apps/api/**, packages/db/**, infra/cpanel/**,
# or this workflow file. Each push:
#   1) Builds the API (tsc + prisma generate)
#   2) Uploads the production bundle to cPanel via FTP
#   3) POSTs to a PHP webhook that runs pnpm install, prisma db push,
#      restarts Passenger, and smoke-tests the health endpoint.
#
# Required GitHub Secrets (repo Settings → Secrets and variables → Actions):
#   CPANEL_FTP_HOST       ftp.yourdomain.com (or the IP)
#   CPANEL_FTP_USER       cpanel username
#   CPANEL_FTP_PASSWORD   FTP password (account-level, NOT the master)
#   CPANEL_API_DIR        Remote path, e.g. /home/user/xovenmart-api
#   CPANEL_DEPLOY_URL     Full URL to deploy-api.php in public_html,
#                         e.g. https://xovenmart.com/deploy-api.php
#   CPANEL_DEPLOY_TOKEN   Shared secret baked into the PHP file (must match)
#   CPANEL_HEALTH_URL     e.g. https://api.yourdomain.com/api/v1/health
#
# Optional SSH secrets (use only if your cPanel has SSH access):
#   CPANEL_SSH_HOST, CPANEL_SSH_USER, CPANEL_SSH_KEY (private key)
#
# Why a PHP webhook? Shared cPanel accounts don't expose SSH/Terminal, so
# the workflow can't run pnpm install / prisma / restart Passenger directly.
# The PHP file lives at public_html/deploy-api.php and orchestrates
# everything server-side via shell_exec. See deploy-bundle/public_html-deploy-api.php
# for the full source.
# =============================================================================

on:
  # Fully automatic: every push to main that touches the API code, the
  # shared @xovenmart/db package, the deploy infra, or this workflow file
  # triggers a build → FTP upload → PHP webhook deploy. The workflow_run
  # trigger is gone (it caused duplicate runs in earlier iterations).
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "infra/cpanel/**"
      - ".github/workflows/deploy-api-cpanel.yml"
  # Manual trigger still available for ad-hoc deploys / rollbacks.
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual deploy reason (logged on the server)"
        required: false
        default: "manual"

concurrency:
  group: api-cpanel-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build + upload to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs on both push and workflow_dispatch. The server-side heavy lifting
    # (pnpm install, prisma db push, restart) happens inside the PHP webhook,
    # so the workflow just needs to ship the files and trigger the webhook.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Manual trigger uses github.head_ref / github.ref (current branch tip).
        ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 is the latest LTS and is fully supported on GitHub Actions.
          # Node 20 is being deprecated (Sep 2025) and will be force-upgraded to 24.
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client (build-time only)
        run: pnpm --filter @xovenmart/db generate

      - name: Build API
        run: pnpm --filter @xovenmart/api build

      - name: Verify build artifact
        run: |
          test -f apps/api/dist/main.js || (echo "main.js missing" && exit 1)
          echo "Build artifact OK ($(du -sh apps/api/dist | cut -f1))"

      - name: Generate schema.sql from Prisma schema
        # The PHP webhook imports this SQL into the empty Postgres database
        # on first deploy (and as a safety net on every deploy). Generated
        # on-the-fly so it always matches the current Prisma schema.
        run: |
          cd packages/db
          node_modules/.bin/prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > ../../schema.sql
          cd ../..
          # Prepend pg_trgm extension + bootstrap admin user (idempotent).
          # The bcrypt hash is for "Admin@1234" with 12 rounds — CHANGE
          # the password immediately after first admin login.
          ADMIN_ID="c$(openssl rand -hex 12)"
          ADMIN_HASH='$2a$12$zDPjZg6w4T9ZdqzOPE.9yu3FoK0l1L0D8mWRRNiW7ofPJG8ym5DEa'
          cat > deploy/schema.sql <<SQL
          -- XovenMart schema dump + bootstrap admin (generated $(date -u +%Y-%m-%dT%H:%M:%SZ))
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          INSERT INTO admin_users (id, email, password_hash, name, role, is_active, created_at, updated_at)
          VALUES ('${ADMIN_ID}', 'admin@xovenmart.com', '${ADMIN_HASH}', 'Site Admin', 'ADMIN', true, NOW(), NOW())
          ON CONFLICT (email) DO NOTHING;
          SQL
          cat schema.sql >> deploy/schema.sql
          echo "schema.sql: $(wc -l < deploy/schema.sql) lines, $(du -h deploy/schema.sql | cut -f1)"

      - name: Prepare deploy bundle
        run: |
          # Build a clean deploy/ tree containing everything the server needs:
          #   - apps/api/dist (compiled JS)
          #   - apps/api/package.json
          #   - apps/api/scripts/cpanel-restart.sh
          #   - packages/db (prisma schema + generated client + package.json)
          #   - schema.sql (PHP webhook imports this into the DB)
          #   - pnpm-lock.yaml (for reproducible install)
          #   - .npmrc (pnpm settings)
          #   - apps/api/.env.example (so operator knows what env vars to set)
          mkdir -p deploy/apps/api/dist
          mkdir -p deploy/apps/api/scripts
          mkdir -p deploy/packages/db

          cp -r apps/api/dist/.          deploy/apps/api/dist/
          cp apps/api/package.json        deploy/apps/api/
          cp apps/api/tsconfig.json      deploy/apps/api/
          cp apps/api/nest-cli.json       deploy/apps/api/
          cp -r apps/api/scripts/.        deploy/apps/api/scripts/

          # Write a tiny wrapper at deploy/ root so cPanel Passenger can use
          # just `main.js` as the startup file (no path prefix needed).
          cat > deploy/main.js <<'WRAPPER'
          // Thin entry-point shim. cPanel "Setup Node.js App" lets you specify
          // a startup file; some operators prefer it at the app root.
          // This wrapper just delegates to the real NestJS entry.
          require('./apps/api/dist/main.js');
          WRAPPER

          # Copy the entire packages/db (includes schema, generated client, pkg.json)
          rsync -a --delete \
            --exclude='node_modules' \
            --exclude='dev.db*' \
            packages/db/ deploy/packages/db/

          cp pnpm-lock.yaml               deploy/
          cp pnpm-workspace.yaml          deploy/
          cp .npmrc                       deploy/ 2>/dev/null || true
          cp apps/api/.env.example        deploy/apps/api/.env.example 2>/dev/null || true

          # Add a tiny deploy marker (timestamp + commit) for traceability
          printf '%s\n%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.sha }}" \
            > deploy/.deploy-info
          echo "--- deploy/ contents ---"
          find deploy -maxdepth 4 -type f | head -40
          echo "--- size ---"
          du -sh deploy

      - name: Upload to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: deploy/
          server-dir: ${{ secrets.CPANEL_API_DIR }}/
          # Don't blow away other things in the dir; only overwrite our files
          exclude: |
            **/.git/**
            **/node_modules/**
            **/.env
            **/.env.local
          dangerous-clean-slate: false
          log-level: minimal

      - name: Trigger server-side deploy (webhook or SSH)
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_API_DIR: ${{ secrets.CPANEL_API_DIR }}
          CPANEL_DEPLOY_URL: ${{ secrets.CPANEL_DEPLOY_URL }}
          CPANEL_DEPLOY_TOKEN: ${{ secrets.CPANEL_DEPLOY_TOKEN }}
        run: |
          set +e
          if [ -n "$CPANEL_SSH_HOST" ] && [ -n "$CPANEL_SSH_KEY" ]; then
            echo "Deploy mode: SSH"
            mkdir -p ~/.ssh
            echo "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_key
            chmod 600 ~/.ssh/cpanel_key
            ssh -i ~/.ssh/cpanel_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
                "cd $CPANEL_API_DIR && bash apps/api/scripts/cpanel-restart.sh"
            SSH_EXIT=$?
            rm -f ~/.ssh/cpanel_key
            if [ $SSH_EXIT -eq 0 ]; then
              echo "SSH deploy OK"
              exit 0
            fi
            echo "SSH deploy failed (exit $SSH_EXIT) — falling back to webhook"
          fi

          if [ -n "$CPANEL_DEPLOY_URL" ]; then
            # Webhook mode (default for shared cPanel with no SSH):
            # the deployed public_html/deploy-api.php runs everything that
            # the workflow can't — schema import, pnpm install, prisma
            # generate, prisma db push, Passenger restart, smoke test.
            echo "Deploy mode: webhook -> $CPANEL_DEPLOY_URL"
            # 300s timeout because the webhook does pnpm install server-side
            # (first deploy can take ~90s, subsequent ~30s).
            curl -fsS -m 300 -X POST \
              -H "Authorization: Bearer $CPANEL_DEPLOY_TOKEN" \
              "$CPANEL_DEPLOY_URL"
            echo "Webhook deploy OK"
            exit 0
          fi

          # No restart secrets configured. Soft warning — files uploaded but
          # Passenger won't auto-reload without either touch package.json
          # (which the workflow can't do without SSH) or a manual Restart.
          echo "::warning::No deploy mode configured (no SSH key, no webhook URL)."
          echo "::warning::Files uploaded but Passenger won't reload them. Click 'Restart' in cPanel -> Setup Node.js App."
          exit 0

      - name: Smoke test
        if: env.CPANEL_HEALTH_URL != ''
        run: |
          echo "Waiting 15s for server to come back up..."
          sleep 15
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ secrets.CPANEL_HEALTH_URL }}" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          echo "Health check never returned 200 — check cPanel app logs"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::API deploy failed. Check the workflow logs and cPanel app logs at ${{ secrets.CPANEL_API_DIR }}/deploy.log"