# Gradle build flags for the Android customer app.
# These are referenced from `app/build.gradle.kts` via project.properties / direct read.

# Use AndroidX (mandatory for modern Compose / Material3 / Lifecycle)
android.useAndroidX=true

# Kotlin code style (matches official Kotlin style guide)
kotlin.code.style=official

# JVM args — give Gradle enough heap for Hilt + KSP
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Enable Gradle build cache for faster re-runs
org.gradle.caching=true

# Use Compose Kotlin compiler plugin (handled by Kotlin 2.0.x compose plugin)
# No manual kotlinCompilerExtensionVersion needed in Kotlin 2.0+.

# Performance: parallel builds on
org.gradle.parallel=true

# Skip non-essential AGP features for faster builds
android.nonTransitiveRClass=true
android.nonFinalResIds=true
